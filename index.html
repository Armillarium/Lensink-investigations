<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LensInk Investigations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
        }
        header {
            background-color: #0d1b2a;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            animation: fadeIn 2s ease-in;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        header img {
            height: 50px;
            margin-right: 15px;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #1f4068;
            padding: 10px;
            animation: slideDown 1s ease-in-out;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            transition: color 0.3s ease;
        }
        nav a:hover {
            color: #e63946;
        }
        .container {
            padding: 20px;
            text-align: center;
            animation: fadeInUp 1.5s ease-in-out;
        }
        .hero {
            background-image: url('detective-background.jpg'); /* Voeg je afbeelding toe */
            background-size: cover;
            background-position: center;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
        }
        .btn {
            display: inline-block;
            background-color: #e63946;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            margin-top: 20px;
            border-radius: 5px;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }
        .btn:hover {
            transform: scale(1.1);
            background-color: #b02a37;
        }
        footer {
            background-color: #0d1b2a;
            text-align: center;
            padding: 10px;
            position: relative;
            width: 100%;
            bottom: 0;
            animation: fadeIn 2s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes fadeInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="LensInk Investigations Logo"> <!-- Voeg je logo toe -->
        LensInk Investigations
    </header>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">Over Ons</a>
        <a href="#services">Diensten</a>
        <a href="#contact">Contact</a>
    </nav>
    <div class="hero">
        Discreet – Betrouwbaar – Effectief
    </div>
    <div class="container" id="home">
        <h1>Welkom bij LensInk Investigations</h1>
        <p>Wij helpen u met betrouwbare en discrete onderzoeken.</p>
        <a href="#contact" class="btn">Neem contact op</a>
    </div>
    <footer>
        &copy; 2025 LensInk Investigations - Alle rechten voorbehouden
    </footer>
</body>
</html>
